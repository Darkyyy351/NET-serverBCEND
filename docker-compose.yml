services:
  app:
    build:
      context: .
      args:
        NET_VERSION: ${NET_VERSION:-0.2.0-dev.0}
        NET_COMMIT_SHA: ${NET_COMMIT_SHA:-development}
        NET_BUILD_TIME: ${NET_BUILD_TIME:-unknown}
        NET_IMAGE_REF: ${NET_IMAGE_REF:-local}
    container_name: net-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NET_RUNTIME: docker
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
